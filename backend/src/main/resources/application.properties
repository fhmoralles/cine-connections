# ==========================================
# DOCKER
# ==========================================
quarkus.container-image.name=cineconnections-backend
quarkus.container-image.group=thinkproject
quarkus.container-image.tag=prod
quarkus.container-image.registry=registry.digitalocean.com
%hom.quarkus.container-image.tag=hom
%dev.quarkus.container-image.tag=dev

# ==========================================
# APPLICATION
# ==========================================
quarkus.application.name=cine-connections


# ==========================================
# HTTP
# ==========================================
quarkus.http.port=8080


# ==========================================
# DATASOURCE
# ==========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}


# ==========================================
# HIBERNATE ORM
# ==========================================
quarkus.hibernate-orm.database.generation=validate


# ==========================================
# FLYWAY
# ==========================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=true
quarkus.flyway.ignore-migration-patterns=*:pending
quarkus.flyway.baseline-on-migrate=true


# ==========================================
# TMDB
# ==========================================

tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.token=${TMDB_API_TOKEN}
tmdb.api.language=en-US


# ==========================================
# TMDB REST CLIENT
# ==========================================

quarkus.rest-client.tmdb-api.url=${tmdb.api.base-url}


# ==========================================
# IP GEOLOCATION (ipwho.is — HTTPS, no API key)
# ==========================================

quarkus.rest-client.ip-geo-api.url=https://ipwho.is
quarkus.rest-client.ip-geo-api.connect-timeout=2000
quarkus.rest-client.ip-geo-api.read-timeout=2000


# ==========================================
# NETWORK EXPANSION
# ==========================================

cine-connections.expansion.max-movies-per-person=20
cine-connections.expansion.max-cast-per-movie=30
cine-connections.expansion.include-crew=false


# ==========================================
# CORS
# ==========================================

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://cine-connections.com,https://www.cine-connections.com,https://cineconnections-prod-vpf3l.ondigitalocean.app
%dev.quarkus.http.cors.origins=http://localhost:4200,http://localhost:4000
%test.quarkus.http.cors.origins=https://cine-connections.com,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.access-control-max-age=24H