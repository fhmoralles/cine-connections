# ==========================================
# APPLICATION
# ==========================================
quarkus.application.name=cine-connections


# ==========================================
# HTTP
# ==========================================
quarkus.http.port=8080


# ==========================================
# DATASOURCE
# ==========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}


# ==========================================
# HIBERNATE ORM
# ==========================================
quarkus.hibernate-orm.database.generation=validate


# ==========================================
# FLYWAY
# ==========================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=true
quarkus.flyway.ignore-migration-patterns=*:pending
quarkus.flyway.baseline-on-migrate=true


# ==========================================
# TMDB
# ==========================================

tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.token=${TMDB_API_TOKEN}
tmdb.api.language=en-US


# ==========================================
# TMDB REST CLIENT
# ==========================================

quarkus.rest-client.tmdb-api.url=${tmdb.api.base-url}


# ==========================================
# NETWORK EXPANSION
# ==========================================

cine-connections.expansion.max-movies-per-person=20
cine-connections.expansion.max-cast-per-movie=30
cine-connections.expansion.include-crew=false